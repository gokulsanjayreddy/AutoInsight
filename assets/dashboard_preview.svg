<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .card { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 8; }
      .metric-card { fill: #1e293b; stroke: #475569; stroke-width: 1; rx: 6; }
      .plot-card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; rx: 8; }
      .header-title { fill: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 26px; font-weight: 700; }
      .header-sub { fill: #94a3b8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; }
      .sec-title { fill: #0f172a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 18px; font-weight: 700; }
      .sec-sub { fill: #64748b; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; }
      .metric-label { fill: #94a3b8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; }
      .metric-val { fill: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 20px; font-weight: 700; }
      .btn-primary { fill: #2563eb; rx: 6; }
      .btn-text { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; text-anchor: middle; }
    </style>
  </defs>

  <!-- App Background -->
  <rect width="1200" height="680" fill="#f8fafc" />

  <!-- Hero Header -->
  <rect x="40" y="24" width="1120" height="96" class="card" />
  <text x="68" y="65" class="header-title">AutoInsight</text>
  <text x="68" y="92" class="header-sub">Automated Exploratory Data Analysis &amp; Diagnostic Suite</text>

  <!-- Metrics Row -->
  <g transform="translate(40, 136)">
    <!-- 6 Metric Cards -->
    <rect x="0" y="0" width="176" height="64" class="metric-card" />
    <text x="14" y="24" class="metric-label">ROWS</text>
    <text x="14" y="49" class="metric-val">250</text>

    <rect x="188" y="0" width="176" height="64" class="metric-card" />
    <text x="202" y="24" class="metric-label">COLUMNS</text>
    <text x="202" y="49" class="metric-val">10</text>

    <rect x="376" y="0" width="176" height="64" class="metric-card" />
    <text x="390" y="24" class="metric-label">NUMERIC COLUMNS</text>
    <text x="390" y="49" class="metric-val">5</text>

    <rect x="564" y="0" width="176" height="64" class="metric-card" />
    <text x="578" y="24" class="metric-label">CATEGORICAL</text>
    <text x="578" y="49" class="metric-val">5</text>

    <rect x="752" y="0" width="176" height="64" class="metric-card" />
    <text x="766" y="24" class="metric-label">MEMORY</text>
    <text x="766" y="49" class="metric-val">0.08 MB</text>

    <rect x="940" y="0" width="180" height="64" class="metric-card" />
    <text x="954" y="24" class="metric-label">DUPLICATE ROWS</text>
    <text x="954" y="49" class="metric-val">0</text>
  </g>

  <!-- Download All ZIP Banner -->
  <g transform="translate(40, 216)">
    <rect x="0" y="0" width="320" height="42" class="btn-primary" />
    <text x="160" y="26" class="btn-text">Download All Plots (42 Files, ZIP)</text>
    <text x="340" y="26" fill="#475569" font-family="-apple-system, sans-serif" font-size="13px">
      Generated standalone separated figures across all feature combinations.
    </text>
  </g>

  <!-- Section 1: Numeric Distributions Preview -->
  <g transform="translate(40, 276)">
    <text x="0" y="18" class="sec-title">Numeric Distributions</text>
    <text x="0" y="36" class="sec-sub">Histograms with kernel density estimation, mean, and median.</text>

    <!-- Card 1 -->
    <rect x="0" y="48" width="548" height="300" class="plot-card" />
    <text x="20" y="78" fill="#1e293b" font-family="sans-serif" font-size="14px" font-weight="600">Distribution: Salary (mean: $68.4k, median: $66.2k)</text>
    <!-- Histogram Bars -->
    <path d="M 40,290 L 70,260 L 100,240 L 130,200 L 160,170 L 190,140 L 220,130 L 250,150 L 280,180 L 310,210 L 340,240 L 370,260 L 400,280 L 430,290" fill="none" stroke="#2563eb" stroke-width="2.5" />
    <rect x="70" y="260" width="25" height="30" fill="#93c5fd" opacity="0.7"/>
    <rect x="100" y="240" width="25" height="50" fill="#93c5fd" opacity="0.7"/>
    <rect x="130" y="200" width="25" height="90" fill="#93c5fd" opacity="0.7"/>
    <rect x="160" y="170" width="25" height="120" fill="#93c5fd" opacity="0.7"/>
    <rect x="190" y="140" width="25" height="150" fill="#93c5fd" opacity="0.7"/>
    <rect x="220" y="130" width="25" height="160" fill="#93c5fd" opacity="0.7"/>
    <rect x="250" y="150" width="25" height="140" fill="#93c5fd" opacity="0.7"/>
    <rect x="280" y="180" width="25" height="110" fill="#93c5fd" opacity="0.7"/>
    <rect x="310" y="210" width="25" height="80" fill="#93c5fd" opacity="0.7"/>
    <line x1="40" y1="290" x2="500" y2="290" stroke="#94a3b8" stroke-width="1.5" />
    <!-- Download Button -->
    <rect x="20" y="306" width="508" height="30" fill="#f1f5f9" stroke="#cbd5e1" rx="4" />
    <text x="274" y="326" fill="#334155" font-family="sans-serif" font-size="12px" font-weight="600" text-anchor="middle">Download Plot (PNG)</text>

    <!-- Card 2: Correlation Heatmap Preview -->
    <rect x="572" y="48" width="548" height="300" class="plot-card" />
    <text x="592" y="78" fill="#1e293b" font-family="sans-serif" font-size="14px" font-weight="600">Correlation Heatmap (Pearson r)</text>
    <!-- Heatmap Grid -->
    <g transform="translate(620, 110)">
      <rect x="0" y="0" width="70" height="32" fill="#1e40af" /><text x="35" y="20" fill="#fff" font-size="11px" text-anchor="middle">1.00</text>
      <rect x="75" y="0" width="70" height="32" fill="#60a5fa" /><text x="110" y="20" fill="#000" font-size="11px" text-anchor="middle">0.45</text>
      <rect x="150" y="0" width="70" height="32" fill="#93c5fd" /><text x="185" y="20" fill="#000" font-size="11px" text-anchor="middle">0.28</text>
      <rect x="225" y="0" width="70" height="32" fill="#bfdbfe" /><text x="260" y="20" fill="#000" font-size="11px" text-anchor="middle">0.12</text>

      <rect x="0" y="36" width="70" height="32" fill="#60a5fa" /><text x="35" y="56" fill="#000" font-size="11px" text-anchor="middle">0.45</text>
      <rect x="75" y="36" width="70" height="32" fill="#1e40af" /><text x="110" y="56" fill="#fff" font-size="11px" text-anchor="middle">1.00</text>
      <rect x="150" y="36" width="70" height="32" fill="#3b82f6" /><text x="185" y="56" fill="#fff" font-size="11px" text-anchor="middle">0.68</text>
      <rect x="225" y="36" width="70" height="32" fill="#dbeafe" /><text x="260" y="56" fill="#000" font-size="11px" text-anchor="middle">0.05</text>

      <rect x="0" y="72" width="70" height="32" fill="#93c5fd" /><text x="35" y="92" fill="#000" font-size="11px" text-anchor="middle">0.28</text>
      <rect x="75" y="72" width="70" height="32" fill="#3b82f6" /><text x="110" y="92" fill="#fff" font-size="11px" text-anchor="middle">0.68</text>
      <rect x="150" y="72" width="70" height="32" fill="#1e40af" /><text x="185" y="92" fill="#fff" font-size="11px" text-anchor="middle">1.00</text>
      <rect x="225" y="72" width="70" height="32" fill="#60a5fa" /><text x="260" y="92" fill="#000" font-size="11px" text-anchor="middle">0.38</text>
    </g>
    <!-- Download Button -->
    <rect x="592" y="306" width="508" height="30" fill="#f1f5f9" stroke="#cbd5e1" rx="4" />
    <text x="846" y="326" fill="#334155" font-family="sans-serif" font-size="12px" font-weight="600" text-anchor="middle">Download Plot (PNG)</text>
  </g>
</svg>
