<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="t d">
  <title id="t">AutoInsight</title>
  <desc id="d">AutoInsight: automated exploratory data analysis for CSV files</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#14213d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1e2d4d" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="14" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="14" fill="url(#grid)" opacity="0.55"/>
  <rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>

  <!-- Wordmark -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="70" y="145" font-size="72" font-weight="700" fill="#f8fafc" letter-spacing="-1.5">Auto<tspan fill="#38bdf8">Insight</tspan></text>
    <text x="72" y="190" font-size="25" fill="#94a3b8">Automated exploratory data analysis for CSV files</text>
    <g font-size="15" fill="#cbd5e1" letter-spacing="1.2">
      <rect x="72" y="224" width="108" height="32" rx="16" fill="none" stroke="#334155"/>
      <text x="126" y="245" text-anchor="middle">PROFILE</text>
      <rect x="192" y="224" width="108" height="32" rx="16" fill="none" stroke="#334155"/>
      <text x="246" y="245" text-anchor="middle">VISUALIZE</text>
      <rect x="312" y="224" width="108" height="32" rx="16" fill="none" stroke="#334155"/>
      <text x="366" y="245" text-anchor="middle">EXPORT</text>
    </g>
  </g>

  <!-- Chart motif -->
  <g transform="translate(760 48)">
    <rect x="0" y="0" width="370" height="224" rx="10" fill="#0f1a30" stroke="#24365c"/>
    <g stroke="#1e2d4d" stroke-width="1">
      <line x1="24" y1="56" x2="346" y2="56"/>
      <line x1="24" y1="104" x2="346" y2="104"/>
      <line x1="24" y1="152" x2="346" y2="152"/>
    </g>
    <line x1="24" y1="196" x2="346" y2="196" stroke="#334155" stroke-width="1.5"/>
    <g fill="url(#bar)">
      <rect x="40"  y="150" width="30" height="46" rx="3"/>
      <rect x="84"  y="120" width="30" height="76" rx="3"/>
      <rect x="128" y="86"  width="30" height="110" rx="3"/>
      <rect x="172" y="60"  width="30" height="136" rx="3"/>
      <rect x="216" y="94"  width="30" height="102" rx="3"/>
      <rect x="260" y="128" width="30" height="68" rx="3"/>
      <rect x="304" y="162" width="30" height="34" rx="3"/>
    </g>
    <path d="M40 150 C 90 120, 130 78, 187 52 S 280 100, 334 150" fill="none" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="1 7"/>
    <path d="M40 150 C 90 120, 130 78, 187 52 S 280 100, 334 150" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.9"/>
    <circle cx="187" cy="52" r="5" fill="#f8fafc" stroke="#38bdf8" stroke-width="2"/>
  </g>
</svg>
