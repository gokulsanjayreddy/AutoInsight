name: AutoInsight CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check .

      - name: Type check with mypy
        run: |
          pip install mypy
          mypy modules/ app.py --ignore-missing-imports

      - name: Test with pytest
        run: |
          pip install pytest
          pytest --tb=short

      - name: Verify streamlit app runs
        run: |
          pip install streamlit
          timeout 30 streamlit run app.py --server.headless true || echo "App verification completed"