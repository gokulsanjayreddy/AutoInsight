name: AutoInsight PR Workflow

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  validate-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy pytest

      - name: Run module import verification
        run: |
          python -c "
          from modules.data_loader import load_csv, infer_column_type, profile_dataset, get_sample_dataset
          from modules.eda import (
              plot_summary_statistics,
              plot_distributions,
              plot_numeric_boxplots,
              plot_categorical_bars,
              plot_correlation_heatmap,
              plot_pairwise_scatter,
              plot_cat_num_relationships,
              plot_cat_cat_relationships,
              plot_missing_values,
              create_all_plots_zip,
          )
          print('All core modules and functions import successfully')
          "

      - name: Lint check with ruff
        run: ruff check .

      - name: Type check with mypy
        run: mypy modules/ app.py --ignore-missing-imports

      - name: Run unit tests
        run: pytest tests/ --tb=short

      - name: Add label for good first issue
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload;
            if (pr.labels && pr.labels.some(l => l.name === 'good first issue')) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: ['good first issue']
              });
            }