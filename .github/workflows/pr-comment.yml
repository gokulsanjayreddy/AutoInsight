name: AutoInsight PR Workflow

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  validate-pr:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install streamlit pandas numpy scikit-learn matplotlib seaborn

      - name: Run basic import test
        run: |
          python -c "
          from modules.data_loader import load_csv, infer_column_type, profile_dataset
          from modules.cleaner import handle_missing_values, detect_and_flag_outliers_iqr, remove_duplicate_rows, coerce_types
          from modules.eda import plot_summary_statistics, plot_distributions, plot_categorical_bars, plot_correlation_heatmap, plot_pairwise_scatter, plot_target_relationships
          from modules.model_selector import detect_task_type, detect_unusable_columns, prepare_features
          from modules.trainer import train_classification_models, train_regression_models, plot_confusion_matrix, plot_roc_curve, plot_predicted_vs_actual, plot_feature_importance
          from modules.report import generate_report
          print('All modules import successfully')
          "

      - name: Lint check
        run: |
          pip install ruff
          ruff check .

      - name: Add label for good first issue
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload;
            if (pr.labels.some(l => l.name === 'good first issue')) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: ['good first issue']
              });
            }