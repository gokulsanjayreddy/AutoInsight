[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autoinsight"
version = "0.2.0"
description = "Automated Exploratory Data Analysis and Diagnostic Suite"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.43.0,<2.0.0",
    "pandas>=2.1.0,<3.0.0",
    "numpy>=1.24.0,<3.0.0",
    "matplotlib>=3.8.0,<3.13.0",
    "seaborn>=0.13.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1,<10.0.0",
    "pytest-cov>=4.1.0,<7.0.0",
    "ruff>=0.4.0,<1.0.0",
    "mypy>=1.10.0,<2.0.0",
    "pandas-stubs>=2.1.0,<3.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C90"]
ignore = []

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "seaborn.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "numpy.*"
ignore_errors = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --cov=modules --cov-report=term-missing --cov-fail-under=80"
filterwarnings = [
    "error::DeprecationWarning",
    "ignore:.*vert.*:matplotlib.MatplotlibDeprecationWarning",
    "ignore:.*set_bad.*:PendingDeprecationWarning",
    "ignore:.*set_bad.*:DeprecationWarning",
]
